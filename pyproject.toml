[tool.poetry]
name = "alertio"
version = "0.1.0"
description = ""
authors = ["ale-knk <rb.jandro@gmail.com>"]
readme = "README.md"
packages = [{include = "alertio", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
yfinance = "^0.2.66"
pandas = "^2.3.2"
pyyaml = "^6.0.2"
requests = "^2.31.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
freezegun = "^1.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src/alertio",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "cli: pruebas funcionales de los comandos principales de la CLI",
    "config: validaciones de archivos de configuración",
    "telegram: pruebas funcionales que requieren credenciales de Telegram",
]

[tool.coverage.run]
source = ["src/alertio"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
