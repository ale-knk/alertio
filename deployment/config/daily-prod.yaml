# Configuración de retornos
returns:
  # Ventanas de tiempo para calcular retornos (corto a largo plazo)
  windows: [1, 5, 10, 20, 30, 60]
  
  # Umbrales para alertas (calibrados por ventana de tiempo)
  # Regla: ventanas más largas requieren umbrales más altos
  thresholds:
    - window: 1
      min_threshold: -0.1   # -10% en 1 día: movimiento significativo
      max_threshold: 0.1    # +10% en 1 día
    - window: 5
      min_threshold: -0.1   # -10% en 5 días: semana volátil
      max_threshold: 0.1    # +10% en 5 días
    - window: 10
      min_threshold: -0.10  # -10% en 10 días: 2 semanas de caída
      max_threshold: 0.10   # +10% en 10 días
    - window: 20
      min_threshold: -0.15  # -15% en 20 días: mes de caída sostenida
      max_threshold: 0.15   # +15% en 20 días
    - window: 30
      min_threshold: -0.20  # -20% en 30 días: tendencia bajista mensual
      max_threshold: 0.20   # +20% en 30 días: tendencia alcista mensual
    - window: 60
      min_threshold: -0.25  # -25% en 60 días: cambio de tendencia trimestral
      max_threshold: 0.25   # +25% en 60 días: rally trimestral   

# Configuración de alertas para producción
alerts:
  # Sistema de cooldown inteligente para producción
  cooldown:
    base_days: 1  # Cooldown base más corto para no perder oportunidades
    
    # Cooldowns por magnitud del movimiento (equilibrados)
    magnitude_cooldowns:
      small: 0.25  # < 5%: 6 horas (sensible pero no spam)
      medium: 1    # 5-15%: 1 día (equilibrado)
      large: 3     # > 15%: 3 días (conservador para movimientos grandes)
    
    # Cooldowns por ventana de tiempo (equilibrados por duración)
    window_cooldowns:
      1: 0.125 # 1 día = 3 horas (muy sensible para movimientos diarios)
      5: 0.5   # 5 días = 12 horas (sensible para tendencias semanales)
      10: 1    # 10 días = 1 día (equilibrado)
      20: 2    # 20 días = 2 días (conservador para tendencias largas)
      30: 7    # 30 días = 7 días (1 semana para tendencias mensuales)
      60: 14   # 60 días = 14 días (2 semanas para tendencias trimestrales)
    
    # Cooldown progresivo (OPTIMIZADO - no perder alertas importantes)
    progressive_enabled: true
    progressive_multiplier: 0.2   # Incremento suave (antes: 0.5, 60% menos agresivo)
    max_progressive_multiplier: 1.5  # Límite suave (antes: 2.5)
    # NOTA: Movimientos >20% ignoran automáticamente el progresivo (código actualizado)
  
  # Configuración de Telegram
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    parse_mode: "HTML"
  
  # Configuración específica para alertas de caídas
  drop_alerts:
    enabled: true
  
  # Configuración específica para alertas de subidas
  rise_alerts:
    enabled: true
  
  # Configuración para resumen semanal (deshabilitado en daily)
  weekly_summary:
    enabled: false
