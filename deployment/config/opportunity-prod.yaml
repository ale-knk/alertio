# Configuración de retornos para análisis de oportunidades
returns:
  # Ventanas de tiempo para calcular retornos (optimizadas para oportunidades)
  windows: [5, 10, 20, 30]
  
  # Umbrales para análisis de oportunidades (más conservadores que alertas)
  thresholds:
    - window: 5
      min_threshold: -0.05   # -5% en 5 días: caída semanal
    - window: 10
      min_threshold: -0.08   # -8% en 10 días: caída de 2 semanas
    - window: 20
      min_threshold: -0.12   # -12% en 20 días: caída mensual
    - window: 30
      min_threshold: -0.15   # -15% en 30 días: caída mensual extendida

# Configuración de alertas (solo para notificaciones, no para base de datos)
alerts:
  # Configuración de Telegram para notificaciones de oportunidades
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    parse_mode: "HTML"
