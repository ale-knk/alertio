# Configuración de ejemplo para comando 'weekly-summary'
# Uso: python -m alertio.cli weekly-summary -c config/weekly-summary-example.yaml --db data/alerts.sqlite3

# Días de historial a obtener para cálculos
lookback_days: 400

# Lista de tickers para el resumen semanal
tickers:
  - symbol: "AAPL"
    provider: "yfinance"
    alias: "Apple Inc."
  - symbol: "GOOGL"
    provider: "yfinance"
    alias: "Alphabet Inc."
  - symbol: "MSFT"
    provider: "yfinance"
    alias: "Microsoft Corp."
  - symbol: "NVDA"
    provider: "yfinance"
    alias: "NVIDIA Corp."
  - symbol: "AMZN"
    provider: "yfinance"
    alias: "Amazon.com Inc."
  - symbol: "TSLA"
    provider: "yfinance"
    alias: "Tesla Inc."
  - symbol: "META"
    provider: "yfinance"
    alias: "Meta Platforms Inc."
  - symbol: "SPY"
    provider: "yfinance"
    alias: "SPDR S&P 500 ETF"
  - symbol: "QQQ"
    provider: "yfinance"
    alias: "Invesco QQQ Trust"
  - symbol: "^VIX"
    provider: "yfinance"
    alias: "CBOE Volatility Index"
  - symbol: "^GSPC"
    provider: "yfinance"
    alias: "S&P 500 Index"
  - symbol: "^DJI"
    provider: "yfinance"
    alias: "Dow Jones Industrial Average"

# Configuración de retornos
# NOTA: El comando weekly-summary usa ventanas fijas [1, 5, 10, 20]
# Los thresholds no son necesarios para resúmenes semanales
returns:
  windows: [1, 5, 10, 20]
  # thresholds: []  # No necesarios para weekly-summary

# Configuración de alertas
alerts:
  # Configuración de Telegram (requerida para enviar resumen)
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"  # Variable de entorno
    chat_id: "${TELEGRAM_CHAT_ID}"      # Variable de entorno
    parse_mode: "HTML"
  
  # Configuración para resumen semanal
  weekly_summary:
    enabled: true
