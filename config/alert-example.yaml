# Configuración de ejemplo para comando 'alert'
# Uso: python -m alertio.cli alert -c config/alert-example.yaml --db data/alerts.sqlite3

# Días de historial a obtener para cálculos
lookback_days: 400

# Lista de tickers a monitorear
tickers:
  - symbol: "AAPL"
    provider: "yfinance"
    alias: "Apple"
  - symbol: "GOOGL"
    provider: "yfinance"
    alias: "Google"
  - symbol: "MSFT"
    provider: "yfinance"
    alias: "Microsoft"
  - symbol: "NVDA"
    provider: "yfinance"
    alias: "NVIDIA"
  - symbol: "SPY"
    provider: "yfinance"
    alias: "S&P 500"
  - symbol: "QQQ"
    provider: "yfinance"
    alias: "NASDAQ 100"
  - symbol: "^VIX"
    provider: "yfinance"
    alias: "VIX"

# Configuración de retornos
returns:
  # Ventanas de tiempo para calcular retornos (en días)
  windows: [1, 5, 10, 20]
  
  # Umbrales para generar alertas
  thresholds:
    - window: 1
      min_threshold: -0.05  # Alerta si cae más del 5% en 1 día
      max_threshold: 0.05   # Alerta si sube más del 5% en 1 día
    - window: 5
      min_threshold: -0.10  # Alerta si cae más del 10% en 5 días
      max_threshold: 0.10   # Alerta si sube más del 10% en 5 días
    - window: 10
      min_threshold: -0.15  # Alerta si cae más del 15% en 10 días
      max_threshold: 0.15   # Alerta si sube más del 15% en 10 días
    - window: 20
      min_threshold: -0.20  # Alerta si cae más del 20% en 20 días
      max_threshold: 0.20   # Alerta si sube más del 20% en 20 días

# Configuración de alertas
alerts:
  # Cooldown global por defecto (días)
  cooldown_days: 7
  
  # Configuración de Telegram
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"  # Variable de entorno
    chat_id: "${TELEGRAM_CHAT_ID}"      # Variable de entorno
    parse_mode: "HTML"  # o "MarkdownV2"
  
  # Configuración específica para alertas de caídas
  drop_alerts:
    enabled: true
    cooldown_days: 7  # Sobrescribe el cooldown global para caídas
  
  # Configuración específica para alertas de subidas
  rise_alerts:
    enabled: true
    cooldown_days: 7  # Sobrescribe el cooldown global para subidas
  
  # weekly_summary: no necesario para 'alert'
