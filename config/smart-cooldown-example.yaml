# Configuración de ejemplo con sistema de cooldown inteligente
lookback_days: 400

tickers:
  - symbol: "AAPL"
    provider: "yfinance"
  - symbol: "MSFT"
    provider: "yfinance"
  - symbol: "GOOGL"
    provider: "yfinance"

returns:
  windows: [1, 5, 10, 20]
  thresholds:
    - window: 1
      min_threshold: -0.05  # -5%
      max_threshold: 0.05   # +5%
    - window: 5
      min_threshold: -0.10  # -10%
      max_threshold: 0.10   # +10%
    - window: 10
      min_threshold: -0.15  # -15%
      max_threshold: 0.15   # +15%
    - window: 20
      min_threshold: -0.20  # -20%
      max_threshold: 0.20   # +20%

alerts:
  # Sistema de cooldown inteligente
  cooldown:
    base_days: 3  # Cooldown base global
    
    # Cooldowns por magnitud del movimiento
    magnitude_cooldowns:
      small: 1    # < 5%: 1 día
      medium: 3   # 5-15%: 3 días
      large: 7    # > 15%: 7 días
    
    # Cooldowns por ventana de tiempo (en días)
    window_cooldowns:
      1: 0.5   # 1 día = 12 horas
      5: 2     # 5 días = 2 días
      10: 3    # 10 días = 3 días
      20: 7    # 20 días = 7 días
    
    # Cooldown progresivo
    progressive_enabled: true
    progressive_multiplier: 0.5  # Incremento por alerta consecutiva
    max_progressive_multiplier: 3.0  # Máximo multiplicador
  
  # Configuración de Telegram
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    parse_mode: "HTML"
  
  # Configuraciones específicas por tipo de alerta
  drop_alerts:
    enabled: true
  
  rise_alerts:
    enabled: true
  
  # Weekly summaries (sin cooldown, no se guardan en DB)
  weekly_summary:
    enabled: true
