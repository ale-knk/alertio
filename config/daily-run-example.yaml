# Configuración de ejemplo para comando 'daily-run'
# Uso: python -m alertio.cli daily-run -c config/daily-run-example.yaml --db data/alerts.sqlite3 --include-weekly

# Días de historial a obtener para cálculos
lookback_days: 400

# Lista de tickers a monitorear
tickers:
  - symbol: "AAPL"
    provider: "yfinance"
    alias: "Apple Inc."
  - symbol: "GOOGL"
    provider: "yfinance"
    alias: "Alphabet Inc."
  - symbol: "MSFT"
    provider: "yfinance"
    alias: "Microsoft Corp."
  - symbol: "NVDA"
    provider: "yfinance"
    alias: "NVIDIA Corp."
  - symbol: "AMZN"
    provider: "yfinance"
    alias: "Amazon.com Inc."
  - symbol: "TSLA"
    provider: "yfinance"
    alias: "Tesla Inc."
  - symbol: "META"
    provider: "yfinance"
    alias: "Meta Platforms Inc."
  - symbol: "SPY"
    provider: "yfinance"
    alias: "SPDR S&P 500 ETF"
  - symbol: "QQQ"
    provider: "yfinance"
    alias: "Invesco QQQ Trust"
  - symbol: "^VIX"
    provider: "yfinance"
    alias: "CBOE Volatility Index"
  - symbol: "^GSPC"
    provider: "yfinance"
    alias: "S&P 500 Index"

# Configuración de retornos
returns:
  # Ventanas de tiempo para calcular retornos (en días)
  windows: [1, 5, 10, 20]
  
  # Umbrales para generar alertas
  thresholds:
    - window: 1
      min_threshold: -0.05  # Alerta si cae más del 5% en 1 día
      max_threshold: 0.05   # Alerta si sube más del 5% en 1 día
    - window: 5
      min_threshold: -0.08  # Alerta si cae más del 8% en 5 días
      max_threshold: 0.08   # Alerta si sube más del 8% en 5 días
    - window: 10
      min_threshold: -0.12  # Alerta si cae más del 12% en 10 días
      max_threshold: 0.12   # Alerta si sube más del 12% en 10 días
    - window: 20
      min_threshold: -0.18  # Alerta si cae más del 18% en 20 días
      max_threshold: 0.18   # Alerta si sube más del 18% en 20 días

# Configuración de alertas
alerts:
  # Sistema de cooldown inteligente para daily-run
  cooldown:
    base_days: 2  # Cooldown base más corto para daily-run
    
    # Cooldowns por magnitud del movimiento (optimizados para daily)
    magnitude_cooldowns:
      small: 0.5   # < 5%: 12 horas (más sensible)
      medium: 2    # 5-15%: 2 días
      large: 5     # > 15%: 5 días
    
    # Cooldowns por ventana de tiempo (optimizados para daily-run)
    window_cooldowns:
      1: 0.25  # 1 día = 6 horas (muy sensible)
      5: 1     # 5 días = 1 día
      10: 2    # 10 días = 2 días
      20: 4    # 20 días = 4 días
    
    # Cooldown progresivo (más agresivo para evitar spam)
    progressive_enabled: true
    progressive_multiplier: 0.75  # Incremento más rápido
    max_progressive_multiplier: 4.0  # Máximo multiplicador más alto
  
  # Configuración de Telegram
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"  # Variable de entorno
    chat_id: "${TELEGRAM_CHAT_ID}"      # Variable de entorno
    parse_mode: "HTML"
  
  # Configuración específica para alertas de caídas
  drop_alerts:
    enabled: true
  
  # Configuración específica para alertas de subidas
  rise_alerts:
    enabled: true
  
  # Configuración para resumen semanal
  weekly_summary:
    enabled: true
