# Configuración de ejemplo para comando 'daily-run'
# Uso: python -m alertio.cli daily-run -c config/daily-run-example.yaml --db data/alerts.sqlite3 --include-weekly

# Días de historial a obtener para cálculos
lookback_days: 400

# Lista de tickers a monitorear
tickers:
  - symbol: "AAPL"
    provider: "yfinance"
    alias: "Apple Inc."
  - symbol: "GOOGL"
    provider: "yfinance"
    alias: "Alphabet Inc."
  - symbol: "MSFT"
    provider: "yfinance"
    alias: "Microsoft Corp."
  - symbol: "NVDA"
    provider: "yfinance"
    alias: "NVIDIA Corp."
  - symbol: "AMZN"
    provider: "yfinance"
    alias: "Amazon.com Inc."
  - symbol: "TSLA"
    provider: "yfinance"
    alias: "Tesla Inc."
  - symbol: "META"
    provider: "yfinance"
    alias: "Meta Platforms Inc."
  - symbol: "SPY"
    provider: "yfinance"
    alias: "SPDR S&P 500 ETF"
  - symbol: "QQQ"
    provider: "yfinance"
    alias: "Invesco QQQ Trust"
  - symbol: "^VIX"
    provider: "yfinance"
    alias: "CBOE Volatility Index"
  - symbol: "^GSPC"
    provider: "yfinance"
    alias: "S&P 500 Index"

# Configuración de retornos
returns:
  # Ventanas de tiempo para calcular retornos (en días)
  windows: [1, 5, 10, 20]
  
  # Umbrales para generar alertas
  thresholds:
    - window: 1
      min_threshold: -0.05  # Alerta si cae más del 5% en 1 día
      max_threshold: 0.05   # Alerta si sube más del 5% en 1 día
    - window: 5
      min_threshold: -0.08  # Alerta si cae más del 8% en 5 días
      max_threshold: 0.08   # Alerta si sube más del 8% en 5 días
    - window: 10
      min_threshold: -0.12  # Alerta si cae más del 12% en 10 días
      max_threshold: 0.12   # Alerta si sube más del 12% en 10 días
    - window: 20
      min_threshold: -0.18  # Alerta si cae más del 18% en 20 días
      max_threshold: 0.18   # Alerta si sube más del 18% en 20 días

# Configuración de alertas
alerts:
  # Cooldown global por defecto (días)
  cooldown_days: 5  # Más frecuente para ejecuciones diarias
  
  # Configuración de Telegram
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"  # Variable de entorno
    chat_id: "${TELEGRAM_CHAT_ID}"      # Variable de entorno
    parse_mode: "HTML"
  
  # Configuración específica para alertas de caídas
  drop_alerts:
    enabled: true
    cooldown_days: 3  # Cooldown más corto para caídas importantes
  
  # Configuración específica para alertas de subidas
  rise_alerts:
    enabled: true
    cooldown_days: 5  # Cooldown estándar para subidas
  
  # Configuración para resumen semanal
  weekly_summary:
    enabled: true
    cooldown_days: 7  # Solo enviar resumen una vez por semana
