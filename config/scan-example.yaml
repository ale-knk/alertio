# Configuración de ejemplo para comando 'scan'
# Uso: python -m alertio.cli scan -c config/scan-example.yaml

# Días de historial a obtener para cálculos
lookback_days: 400

# Lista de tickers a monitorear
tickers:
  - symbol: "AAPL"
    provider: "yfinance"
    alias: "Apple"
  - symbol: "GOOGL"
    provider: "yfinance"
    alias: "Google"
  - symbol: "MSFT"
    provider: "yfinance"
    alias: "Microsoft"
  - symbol: "NVDA"
    provider: "yfinance"
    alias: "NVIDIA"
  - symbol: "SPY"
    provider: "yfinance"
    alias: "S&P 500"
  - symbol: "QQQ"
    provider: "yfinance"
    alias: "NASDAQ 100"
  - symbol: "^VIX"
    provider: "yfinance"
    alias: "VIX"

# Configuración de retornos
returns:
  # Ventanas de tiempo para calcular retornos (en días)
  windows: [1, 5, 10, 20]
